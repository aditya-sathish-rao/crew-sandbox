name: ci

# Only what a build can prove with no VM and no network: the Go unit tests
# (including `node --check` and `bash -n` on every embedded script), both
# `--selftest` runs, prettier, an evaluation of the exported guest configuration,
# an evaluation of the example consumer, and the operator binary itself.
#
# The phase gates are deliberately not here. They assert on this operator's guest,
# with this operator's secrets, and `vmType: vz` cannot nest inside a hosted macOS
# runner - see "Where the gates run" in the README.
#
# Two jobs, split by what actually needs macOS. Only the darwin-module evaluation
# and the macOS package build require a macOS runner; everything else is portable
# Nix, and running it on Linux matters because macOS runners are scarce enough that
# a queued run can sit for an hour and then be cancelled before it starts.
#
# The Linux job runs on an arm64 runner because the flake builds for `aarch64-linux`
# and `aarch64-darwin` only. Add a system to `flake.nix` before switching the runner
# architecture.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull-request run has nothing left to prove, so cancelling it is
  # free. A superseded run on main is the only record that commit was checked, so it
  # is allowed to finish rather than being dropped by the next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: unit, selftests and formatting (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: run the portable checks
        run: |
          nix build --no-link -L \
            .#checks.aarch64-linux.unit \
            .#checks.aarch64-linux.selftest \
            .#checks.aarch64-linux.examples \
            .#checks.aarch64-linux.formatting

  darwin:
    name: darwin module and package (aarch64-darwin)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: build the operator binary
        run: nix build .#crew-sandbox --no-link -L
      - name: evaluate the darwin module
        run: nix build --no-link -L .#checks.aarch64-darwin.darwin
      - name: evaluate the example consumer
        run: nix build --no-link -L .#checks.aarch64-darwin.examples
